name: ci
# build-machine: skip build reason=the release workflow packs the plugin; a plugin has no build of its own
# build-machine: skip smoke reason=a plugin runs only inside the application; the core window checks start it

# release.yml calls this workflow on each push to main, so a push runs the checks once.
on:
  workflow_call:
  pull_request:

jobs:
  test:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          # The commit message check reads every commit of the pushed range.
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
      - uses: pnpm/action-setup@v4
      - name: Install
        run: make install
      - name: Test
        run: make test
      - name: Check
        run: make check
      - name: Commit messages
        if: github.event_name == 'pull_request' || github.event.before != '0000000000000000000000000000000000000000'
        run: pnpm exec soksak-commits ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || format('{0}..{1}', github.event.before, github.sha) }}
