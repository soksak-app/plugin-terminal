name: release
# build-machine: skip test reason=the ci workflow tests the tagged commit on main before the tag is pushed
# build-machine: skip smoke reason=a plugin runs only inside the application; the core window checks start it

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      # sok plugin pack 은 core 의 같은 version tag 에서 빌드한다.
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/core
          ref: ${{ github.ref_name }}
          path: core
      - uses: actions/setup-go@v5
        with:
          go-version-file: core/packages/sok/wailsv3/go.mod
      - name: Build sok
        run: go build -C core/packages/sok/wailsv3 -o "$RUNNER_TEMP/sok" ./src/cmd/sok
      - name: Pack
        run: make pack SOK="$RUNNER_TEMP/sok" OUT=dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
      # registry 에 새 version 을 더하는 pull request 를 연다(core docs/spec/registry.md#releases-of-soksak-components).
      # REGISTRY_TOKEN 은 soksak-app/registry 에 pull request 를 열 수 있는 token 이고, 그 소유자가 작성자다.
      - uses: actions/checkout@v4
        with:
          repository: soksak-app/registry
          path: registry
      - uses: actions/setup-node@v4
        with:
          node-version-file: registry/.node-version
      - name: Add the version to the registry entry
        run: node registry/scripts/add-version.mjs plugin --registry registry --package . --archive "dist/terminal-${GITHUB_REF_NAME#v}.tgz"
      - uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.REGISTRY_TOKEN }}
          path: registry
          branch: plugin-terminal-${{ github.ref_name }}
          title: Add terminal ${{ github.ref_name }}
          commit-message: Add terminal ${{ github.ref_name }}
          add-paths: plugins
